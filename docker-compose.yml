services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 5

  fraud-mock:
    build:
      context: ../demo-payment-service
      dockerfile: Dockerfile.fraud-mock
    restart: unless-stopped
    environment:
      # ${VAR:-default} interpolation: the eval harness can override this per
      # scenario (S04) by setting FRAUD_MOCK_LATENCY_MS in its own subprocess
      # environment before `docker compose up -d --force-recreate fraud-mock`.
      FRAUD_MOCK_LATENCY_MS: ${FRAUD_MOCK_LATENCY_MS:-50}
      FRAUD_MOCK_FAILURE_RATE: "0"
    ports:
      - "127.0.0.1:8010:8010"

  demo-payment-service:
    build:
      context: ../demo-payment-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/payments
      FRAUD_MOCK_URL: http://fraud-mock:8010
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DEPLOYMENT_ENVIRONMENT: local
    ports:
      - "127.0.0.1:8800:8000"
    depends_on:
      postgres:
        condition: service_healthy
      fraud-mock:
        condition: service_started
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - loki
      - tempo

  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infra/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infra/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlSearch"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
      - tempo
      - prometheus

  # Phase 11's "Compose profile for the agent" — opt-in (`docker compose
  # --profile agent up`), so it never starts with a plain `docker compose up`.
  # AGENT_MODE is hardcoded to rca here regardless of .env — see
  # Dockerfile.agent for why fix-mode can't safely run in this container.
  detector:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: Dockerfile.agent
    command: ["app.detector.poller", "payment-service"]
    restart: unless-stopped
    environment:
      AGENT_DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      PROMETHEUS_URL: http://prometheus:9090
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: Dockerfile.agent
    command: ["app.worker", "--forever"]
    restart: unless-stopped
    environment:
      AGENT_MODE: rca
      AGENT_DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      # code_investigation's read-only git/code tools need the demo repo at
      # the same relative path repo_registry.py resolves on the host
      # (../demo-payment-service from config/services.yaml's directory).
      - ../demo-payment-service:/demo-payment-service:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:
