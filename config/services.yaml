# repo_registry.py only ever reads `local_path` — it's the investigation/fix
# tools' source of truth for where the repo lives on disk (git tools and the
# sandbox all operate on this path). `repository` (a GitHub URL) is
# informational only; the write tools' GitHub REST calls use GITHUB_REPO
# from .env instead.
services:
  payment-service:
    repository: null
    local_path: ../demo-payment-service
    branch: main
    language: python
    owner: payments
    critical_routes:
      - "POST /payments"
      - "GET /payments/{payment_id}"
    fix_allowed: true
