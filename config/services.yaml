# Section 15.2 of the architecture doc. repo_registry.py only ever reads
# `local_path` — it's the investigation/fix tools' source of truth for where
# the repo lives on disk (git tools, worktrees, sandbox all operate on this
# path). The demo repo IS pushed to GitHub now (gautamamber/demo-payment-
# service-triage, see GITHUB_REPO in .env), but that's used only by the
# write tools' GitHub REST calls (create_draft_pr) — `repository` below stays
# informational/unused.
services:
  payment-service:
    repository: null
    local_path: ../demo-payment-service
    branch: main
    language: python
    owner: payments
    critical_routes:
      - "POST /payments"
      - "GET /payments/{payment_id}"
    fix_allowed: true
