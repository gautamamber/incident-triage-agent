detection:
  poll_seconds: 30
  window_minutes: 5
  min_occurrences: 5
  resolve_after_minutes: 30
  cooldown_minutes: 120
  always_page_exceptions: ["MemoryError"]

severity:
  p1: { error_ratio: 0.05, errors_5m: 50 }
  p2: { error_ratio: 0.01, errors_5m: 10 }

investigation:
  max_code_tool_calls: 12

confidence:
  high: 0.75
  medium: 0.50
  weights:
    trace_hotspot: 0.25
    code_location: 0.20
    change_correlation: 0.20
    metric_corroboration: 0.15
    log_corroboration: 0.10
    historical_match: 0.10
    missing_evidence_penalty: 0.10
    conflicting_evidence_penalty: 0.20

fix:
  max_attempts: 3
  max_files: 3
  max_changed_lines: 80
  allowed_paths: ["app/", "tests/"]
  denied_paths: ["Dockerfile", ".github/", "pyproject.toml", "uv.lock", ".env"]
  sandbox_timeout_seconds: 300

# Doc section 11.7 — the two truly unbounded-cost loops (code_investigation's
# tool-call loop, the fix subgraph's patch-retry loop) check both of these on
# every iteration and stop early rather than run away. max_runs_per_hour is
# enforced by the worker before it claims a new incident, not per-node.
budget:
  max_tokens_per_run: 150000
  max_wall_seconds_per_run: 600
  max_runs_per_hour: 10
